name: Build and publish Piko Custom

on:
  push:
    branches: [main]
    paths-ignore: [patches-bundle.json, 'docs/**', README.md]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: piko-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: burrunan/gradle-cache-action@v3
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build the combined bundle
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process -PpikoBundleTarget=combined
          clean :extensions:instagram:test :extensions:newx:test buildAndroid :patches:build
          :patches:lintNewxResolvers :patches:checkExtensionDescriptors
      - name: Check Instagram Chinese resource bindings
        run: python3 docs/instagram-validation/check-ig-string-context.py
      - name: Record exact source and bundle checksums
        run: python3 .github/scripts/bundle_metadata.py
      - uses: actions/upload-artifact@v7
        with:
          name: piko-custom-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piko-custom-tests
          path: |
            patches/build/reports/
            extensions/instagram/build/reports/tests/
            extensions/newx/build/reports/tests/
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'YongkeDet/piko-custom' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download this run's verified bundle
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name piko-custom-bundle --dir dist
      - name: Publish the matching source and bundle
        run: python3 .github/scripts/publish_bundle.py
